name: remember-api

# 拓扑：仅 publish api:4000。mem0-bridge 只走 docker 内网（api → http://mem0-bridge:8001），不对外。
# 记忆兜底：若 bridge 暂不可用，把 api.environment.MEM0_BASE_URL 删掉/置空 → api 自动落 Postgres DbMemoryProvider。

services:
  api:
    image: remember-api/api:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - path: .env.production
        required: false
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      # 运行时无状态；DB/模型 provider 全走 env_file
      MEM0_BASE_URL: "http://mem0-bridge:8001"
      # 根 CA 不在这里挂文件：Supabase 的私有根 CA 用 .env.production 的 DATABASE_SSL_CA_PEM
      # 填 PEM 内容即可（托管平台挂不了文件，两边因此用同一条路）。公开 CA 的 Postgres
      # 什么都不用配 —— client.ts 拿不到 CA 就退回系统信任库。
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mem0-bridge:
        condition: service_started
    restart: unless-stopped

  mem0-bridge:
    image: remember-api/mem0-bridge:0.1.0
    build:
      context: scripts/mem0-bridge
      dockerfile: Dockerfile
    environment:
      MEM0_DIR: /var/lib/mem0
      MEM0_HOST: "0.0.0.0"
      MEM0_PORT: "8001"
      # fastembed 模型缓存（与 qdrant/history 同卷持久化）
      FASTEMBED_CACHE_PATH: /var/lib/mem0/model_cache
      HF_HUB_OFFLINE: "1"
      # HF 下载端点：大陆默认 hf-mirror；海外部署 export HF_ENDPOINT=https://huggingface.co
      # （compose 变量插值读 shell env；download-model.sh 亦用 -e 覆盖，见 runbook 第 4 步）
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
      MEM0_TELEMETRY: "false"
    volumes:
      - mem0_data:/var/lib/mem0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  # 一次性迁移/种子：不随 `up` 自启，显式 `docker compose --profile init run --rm db-init`
  db-init:
    image: remember-api/db-init:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - path: .env.production
        required: false
    # 根 CA 同上：走 DATABASE_SSL_CA_PEM，不挂文件
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    profiles: ["init"]
    restart: "no"

volumes:
  mem0_data:
