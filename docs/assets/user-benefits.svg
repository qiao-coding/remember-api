<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">User benefits</title>
  <desc id="desc">remember-api reduces repeated explanation, preserves project continuity, and makes memory controllable.</desc>
  <rect width="1200" height="560" rx="28" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1120" height="480" rx="24" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="82" y="104" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">它实际帮用户省下什么</text>
  <text x="82" y="138" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="17">少解释、少找历史、少重复试错，让 AI 工作流更连续。</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="94" y="202" width="300" height="230" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/>
    <circle cx="144" cy="254" r="24" fill="#1D4ED8"/>
    <text x="136" y="263" fill="#FFFFFF" font-size="24" font-weight="800">1</text>
    <text x="184" y="260" fill="#1E40AF" font-size="22" font-weight="800">少重复解释自己</text>
    <text x="130" y="318" fill="#334155" font-size="16">偏好、身份、回答风格</text>
    <text x="130" y="348" fill="#334155" font-size="16">长期保存，可跨工具复用</text>

    <rect x="450" y="202" width="300" height="230" rx="22" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="500" cy="254" r="24" fill="#047857"/>
    <text x="492" y="263" fill="#FFFFFF" font-size="24" font-weight="800">2</text>
    <text x="540" y="260" fill="#047857" font-size="22" font-weight="800">少重复解释项目</text>
    <text x="486" y="318" fill="#334155" font-size="16">架构、状态、决策、问题</text>
    <text x="486" y="348" fill="#334155" font-size="16">按 Project 隔离和召回</text>

    <rect x="806" y="202" width="300" height="230" rx="22" fill="#FFF7ED" stroke="#FED7AA"/>
    <circle cx="856" cy="254" r="24" fill="#C2410C"/>
    <text x="848" y="263" fill="#FFFFFF" font-size="24" font-weight="800">3</text>
    <text x="896" y="260" fill="#C2410C" font-size="22" font-weight="800">少失控的记忆</text>
    <text x="842" y="318" fill="#334155" font-size="16">可查看、可修改、可删除</text>
    <text x="842" y="348" fill="#334155" font-size="16">token 和成本可观察</text>
  </g>

  <rect x="366" y="466" width="468" height="44" rx="12" fill="#0F172A"/>
  <text x="421" y="494" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">把上下文从“聊天记录”变成用户可控资产</text>
</svg>
