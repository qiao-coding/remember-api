<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Memory console</title>
  <desc id="desc">A dashboard-style illustration of editable personal AI memories and usage metrics.</desc>
  <rect width="1200" height="640" rx="28" fill="#F7FAFC"/>
  <rect x="42" y="42" width="1116" height="556" rx="24" fill="#FFFFFF" stroke="#D8E0EA"/>
  <rect x="42" y="42" width="220" height="556" rx="24" fill="#0F172A"/>
  <text x="82" y="102" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Remember</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="70" y="150" width="164" height="42" rx="10" fill="#1E293B"/>
    <text x="96" y="177" fill="#BAE6FD">Profiles</text>
    <rect x="70" y="208" width="164" height="42" rx="10" fill="#334155"/>
    <text x="96" y="235" fill="#FFFFFF">Memories</text>
    <rect x="70" y="266" width="164" height="42" rx="10" fill="#1E293B"/>
    <text x="96" y="293" fill="#CBD5E1">Projects</text>
    <rect x="70" y="324" width="164" height="42" rx="10" fill="#1E293B"/>
    <text x="96" y="351" fill="#CBD5E1">Usage</text>
    <rect x="70" y="382" width="164" height="42" rx="10" fill="#1E293B"/>
    <text x="96" y="409" fill="#CBD5E1">Keys</text>
  </g>
  <text x="306" y="105" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">你的 AI 到底记住了什么</text>
  <text x="306" y="139" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">查看、搜索、固定、修正和删除长期记忆，让上下文保持可信。</text>
  <rect x="306" y="180" width="360" height="92" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="330" y="216" fill="#1E40AF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Preference</text>
  <text x="330" y="246" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="17">偏好 TypeScript、pnpm、清晰直接的实现。</text>
  <rect x="306" y="292" width="360" height="92" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="330" y="328" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Decision</text>
  <text x="330" y="358" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="17">使用 Fastify 提供 OpenAI-compatible gateway。</text>
  <rect x="306" y="404" width="360" height="92" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="330" y="440" fill="#C2410C" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Issue</text>
  <text x="330" y="470" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="17">避免把整段 Project 实体直接塞进 prompt。</text>
  <rect x="716" y="180" width="360" height="316" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="752" y="230" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Usage</text>
  <text x="752" y="263" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15">Memory overhead is visible.</text>
  <rect x="752" y="302" width="120" height="116" rx="12" fill="#E0F2FE"/>
  <rect x="898" y="262" width="120" height="156" rx="12" fill="#DCFCE7"/>
  <text x="779" y="450" fill="#0369A1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">memory</text>
  <text x="931" y="450" fill="#15803D" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">model</text>
  <text x="752" y="540" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="15">记忆应该有价值，也应该有边界。</text>
</svg>
